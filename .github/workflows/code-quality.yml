name: Code Quality Checks

on:
  push:
    branches: [ current ]
  pull_request:
    branches: [ current ]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
      security-events: write  # Add permission for SARIF upload

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Run SpotBugs and Checkstyle
      run: mvn clean verify spotbugs:spotbugs checkstyle:checkstyle
      
    - name: Create SARIF directory
      run: mkdir -p sarif-output
      
    - name: Find and copy SARIF files
      run: |
        find . -name "*.sarif" -type f -exec cp {} ./sarif-output/ \;
        ls -la ./sarif-output/

    - name: Upload SpotBugs Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-results
        path: |
          **/target/spotbugsXml.xml
          **/target/site/spotbugs/*.html
        retention-days: 7

    - name: Upload Checkstyle Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checkstyle-results
        path: '**/target/checkstyle-result.xml'
        retention-days: 7
        
    - name: Publish Code Quality Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: ./sarif-output
        category: spotbugs
        
    - name: Annotate Code Quality Issues
      if: always()
      uses: jwgmeligmeyling/checkstyle-github-action@master
      with:
        path: '**/checkstyle-result.xml'
        token: ${{ github.token }}
