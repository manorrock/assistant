name: SpotBugs Check

on:
  push:
    branches: [ current ]
  pull_request:
    branches: [ current ]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
      security-events: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Run SpotBugs
      run: mvn clean verify com.github.spotbugs:spotbugs-maven-plugin:spotbugs -Dspotbugs.outputFormat=xml,html,sarif
    
    - name: Debug output
      run: |
        echo "Listing target directories..."
        find . -name "target" -type d | xargs ls -la
        echo "Searching for SARIF files..."
        find . -name "*.sarif"

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: '**/target/spotbugsXml.sarif'
        category: spotbugs
