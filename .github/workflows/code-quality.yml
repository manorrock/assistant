name: Code Quality Checks

on:
  push:
    branches: [ current ]
  pull_request:
    branches: [ current ]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
      security-events: write  # Add permission for SARIF upload

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Run SpotBugs and Checkstyle
      run: mvn clean verify com.github.spotbugs:spotbugs-maven-plugin:spotbugs -Dspotbugs.outputFormat=xml,html,sarif checkstyle:checkstyle
    
    - name: Debug output
      run: |
        echo "Listing target directories..."
        find . -name "target" -type d | xargs ls -la
        echo "Searching for SARIF files..."
        find . -name "*.sarif" -type f
    
    - name: Upload SpotBugs Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spotbugs-results
        path: |
          **/target/spotbugsXml.xml
          **/target/site/spotbugs/*.html
        retention-days: 7

    - name: Upload Checkstyle Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checkstyle-results
        path: '**/target/checkstyle-result.xml'
        retention-days: 7
    
    # Only run SARIF upload if files are found
    - name: Check for SARIF files
      id: check-sarif
      run: |
        if find . -name "*.sarif" -type f | grep -q .; then
          echo "sarif_files_found=true" >> $GITHUB_OUTPUT
          mkdir -p sarif-output
          find . -name "*.sarif" -type f -exec cp {} ./sarif-output/ \;
        else
          echo "sarif_files_found=false" >> $GITHUB_OUTPUT
          echo "No SARIF files found"
          mkdir -p sarif-output
          echo '{"version":"2.1.0","runs":[]}' > ./sarif-output/empty.sarif
        fi
        ls -la ./sarif-output/
        
    - name: Publish Code Quality Results
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check-sarif.outputs.sarif_files_found == 'true'
      with:
        sarif_file: ./sarif-output
        category: spotbugs
        
    - name: Annotate Code Quality Issues
      if: always()
      uses: jwgmeligmeyling/checkstyle-github-action@master
      with:
        path: '**/checkstyle-result.xml'
        token: ${{ github.token }}
