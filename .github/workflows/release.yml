name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from (default: current)'
        required: false
        default: 'current'
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Update version in pom.xml files
        run: |
          VERSION=${{ github.event.inputs.version }}
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Commit version changes
        run: |
          git add -A
          git commit -m "Release version ${{ github.event.inputs.version }}"

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
        
      - name: Upload CLI JAR
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./cli/target/cli.jar
          asset_name: cli-${{ github.event.inputs.version }}.jar
          asset_content_type: application/java-archive

      - name: Remove artifacts from previous releases (only for 'current' branch)
        if: github.event.inputs.branch == 'current'
        run: |
          # Get list of releases except the current one
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | \
            jq -r '.[] | select(.tag_name != "v${{ github.event.inputs.version }}") | .id')
          
          # For each previous release, delete only its assets (artifacts)
          for RELEASE_ID in $RELEASES; do
            echo "Processing release $RELEASE_ID"
            # Get assets for this release
            ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r '.[] | .id')
            
            # Delete each asset
            for ASSET_ID in $ASSETS; do
              echo "Deleting asset $ASSET_ID from release $RELEASE_ID"
              curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            done
          done

      - name: Create tag
        run: |
          git tag -a v${{ github.event.inputs.version }} -m "Release v${{ github.event.inputs.version }}"
          git push origin v${{ github.event.inputs.version }}

      - name: Prepare for next development version
        if: github.event.inputs.branch == 'current'
        run: |
          # Extract major, minor, patch from version
          VERSION=${{ github.event.inputs.version }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Increment patch version for next development
          NEW_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEW_PATCH-SNAPSHOT"
          
          # Update to next development version
          mvn versions:set -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false
          
          git add -A
          git commit -m "Prepare for next development version $NEXT_VERSION"
          git push origin ${{ github.event.inputs.branch }}
