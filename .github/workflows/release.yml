name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Git user
        run: |
          git config user.name "Manorrock.com"
          git config user.email "info@manorrock.com"

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build with Maven
        run: mvn -DskipTests -ntp -P vscode clean install 

      - name: Build IntelliJ Plugin
        run: |
          cd intellij
          ./gradlew buildPlugin

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          ant -version

      - name: Install Eclipse SDK
        run: |
          wget "https://www.eclipse.org/downloads/download.php?file=/eclipse/downloads/drops4/R-4.35-202502280140/eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz&mirror_id=1" -O eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz
          tar -xzf eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz

      - name: Setup Ant Contrib
        working-directory: eclipse
        run: |
          export ECLIPSE_HOME=$GITHUB_WORKSPACE/eclipse
          ant download-ant-contrib

      - name: Build Eclipse Plugin
        working-directory: eclipse
        run: |
          export ECLIPSE_HOME=$GITHUB_WORKSPACE/eclipse
          ant jar

      - name: Standardize file names
        run: |
          mkdir -p standardized
          cp vscode/extension/*.vsix standardized/Manorrock-Assistant.vsix
          cp cli/target/cli.jar standardized/Manorrock-Assistant.jar
          cp netbeans/target/*.nbm standardized/Manorrock-Assistant.nbm
          cp intellij/build/distributions/*.zip standardized/Manorrock-Assistant-IntelliJ.zip
          cp eclipse/target/com.manorrock.assistant.eclipse_*.jar standardized/Manorrock-Assistant-Eclipse.jar

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
       
      - name: Upload CLI JAR
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./standardized/Manorrock-Assistant.jar
          asset_name: Manorrock-Assistant.jar
          asset_content_type: application/java-archive

      - name: Upload VSCode Extension
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./standardized/Manorrock-Assistant.vsix
          asset_name: Manorrock-Assistant.vsix
          asset_content_type: application/octet-stream
          
      - name: Upload NetBeans NBM Plugin
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./standardized/Manorrock-Assistant.nbm
          asset_name: Manorrock-Assistant.nbm
          asset_content_type: application/octet-stream
          
      - name: Upload IntelliJ Plugin
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./standardized/Manorrock-Assistant-IntelliJ.zip
          asset_name: Manorrock-Assistant-IntelliJ.zip
          asset_content_type: application/zip
          
      - name: Upload Eclipse Plugin
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./standardized/Manorrock-Assistant-Eclipse.jar
          asset_name: Manorrock-Assistant-Eclipse.jar
          asset_content_type: application/java-archive

      - name: Remove artifacts from older releases
        run: |
          # Get all releases sorted by creation date (newest first)
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | \
            jq -r 'sort_by(.created_at) | reverse | .[] | "\(.id)|\(.tag_name)"')
          
          # Current release ID
          CURRENT_TAG="v${{ env.VERSION }}"
          
          # Counter to track how many recent releases we've seen
          COUNT=0
          
          # Process each release
          echo "$RELEASES" | while IFS="|" read -r RELEASE_ID RELEASE_TAG; do
            # Skip the current release
            if [ "$RELEASE_TAG" = "$CURRENT_TAG" ]; then
              echo "Skipping current release: $RELEASE_TAG"
              continue
            fi
            
            # Always preserve SNAPSHOT releases
            if [[ "$RELEASE_TAG" == *"SNAPSHOT"* ]]; then
              echo "Preserving SNAPSHOT release: $RELEASE_TAG"
              continue
            fi
            
            # Increment counter for non-SNAPSHOT releases
            COUNT=$((COUNT + 1))
            
            # Keep the 3 most recent releases (excluding current and SNAPSHOT)
            if [ $COUNT -le 3 ]; then
              echo "Preserving recent release: $RELEASE_TAG"
              continue
            fi
            
            # For older releases, delete their assets
            echo "Processing older release: $RELEASE_TAG (ID: $RELEASE_ID)"
            ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r '.[] | .id')
            
            # Delete each asset
            for ASSET_ID in $ASSETS; do
              echo "Deleting asset $ASSET_ID from release $RELEASE_ID"
              curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            done
          done

