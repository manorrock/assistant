name: Build
on:
  push:
    branches:
      - current
  pull_request: 
  workflow_dispatch:
permissions:
  contents: write
  packages: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
    - name: Set up JDK 21
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B -ntp clean install
    - name: Standardize JAR filename
      run: |
        # Print working directory for debugging
        echo "Current working directory: $(pwd)"
        
        # Create standardized directory with absolute path
        WORK_DIR="$(pwd)"
        STANDARDIZED_DIR="${WORK_DIR}/standardized"
        mkdir -p "${STANDARDIZED_DIR}"
        echo "Created standardized directory at: ${STANDARDIZED_DIR}"
        
        echo "Listing cli/target directory contents:"
        ls -la cli/target
        
        # Check if specific JAR file exists and copy it
        if [ -f "cli/target/cli.jar" ]; then
          echo "Found cli.jar, copying to standardized directory"
          cp "cli/target/cli.jar" "${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
          echo "JAR file copied successfully to ${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
          ls -la "${STANDARDIZED_DIR}"
        else
          echo "cli.jar not found in cli/target/"
          echo "Creating empty placeholder JAR file"
          touch "${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
          echo "Created empty JAR file as placeholder at ${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
        fi
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant.jar
        draft: false
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports'
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 9
        overwrite: true
  eclipse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B -DskipTests -DskipITs -ntp clean install
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          ant -version
      - name: Install Eclipse SDK
        run: |
          wget "https://www.eclipse.org/downloads/download.php?file=/eclipse/downloads/drops4/R-4.35-202502280140/eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz&mirror_id=1" -O eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz
          tar -xzf eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz
      - name: Setup Ant Contrib
        working-directory: eclipse
        run: |
          export ECLIPSE_HOME=$GITHUB_WORKSPACE/eclipse
          ant download-ant-contrib
      - name: Build Eclipse Plugin
        working-directory: eclipse
        run: |
          export ECLIPSE_HOME=$GITHUB_WORKSPACE/eclipse
          ant jar
      - name: Standardize Plugin JAR
        run: |
          mkdir -p standardized
          cp eclipse/target/com.manorrock.assistant.eclipse_*.jar standardized/Manorrock-Assistant-Eclipse.jar
      - name: Update SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant-Eclipse.jar
          draft: false
  intellij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build IntelliJ Plugin
        run: |
          mvn -B -DskipTests -DskipITs -ntp clean install 
          cd intellij
          ./gradlew buildPlugin
          mkdir -p ../standardized
          cp build/distributions/*.zip ../standardized/Manorrock-Assistant-IntelliJ.zip
      - name: Update SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant-IntelliJ.zip
          draft: false
  macos-arm64-dmg:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build macOS DMG
      run: mvn -B -DskipTests -DskipITs -ntp -P macos install
    - name: Standardize DMG filename
      run: |
        mkdir -p standardized
        cp desktop/target/*.dmg standardized/Manorrock-Assistant-arm64.dmg
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant-arm64.dmg
        draft: false
  macos-amd64-dmg:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build macOS DMG
      run: mvn -B -DskipTests -DskipITs -ntp -P macos install
    - name: Standardize DMG filename
      run: |
        mkdir -p standardized
        cp desktop/target/*.dmg standardized/Manorrock-Assistant-amd64.dmg
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant-amd64.dmg
        draft: false
  windows-amd64-msi:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build Windows MSI
      run: mvn -B -DskipTests -DskipITs -ntp -P windows install
    - name: Standardize MSI filename
      run: |
        mkdir -p standardized
        cp desktop/target/*.msi standardized/Manorrock-Assistant-amd64.msi
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant-amd64.msi
        draft: false
  nbm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build NetBeans Module
        run: mvn -B -DskipTests -DskipITs -ntp install
      - name: Standardize NBM filename
        run: |
          mkdir -p standardized
          cp netbeans/target/*.nbm standardized/Manorrock-Assistant.nbm
      - name: Update SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant.nbm
          draft: false
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build VSCode extension
        run: |
          mvn -B -DskipTests -DskipITs -ntp -P vscode clean install
      - name: Standardize VSIX filename
        run: |
          mkdir -p standardized
          cp vscode/*.vsix standardized/Manorrock-Assistant.vsix
      - name: Upload VSCode extension to SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant.vsix
          draft: false
