name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
    - name: Set up JDK 21
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B verify
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports'
        if-no-files-found: ignore
        retention-days: 5
        compression-level: 9
        overwrite: true
    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: |
          cli/target/cli.jar
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
        overwrite: true
        include-hidden-files: false
  coverage:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Generate Coverage Report
        run: mvn test jacoco:report
      - name: Create Coverage Report Comment
        id: coverage-report
        run: |
          sudo apt-get install -y xmlstarlet
          {
            echo "### 📊 Coverage Report"
            echo ""
            echo "| Module | Instructions | Branches |"
            echo "|--------|--------------|----------|"
            for xml in $(find . -name "jacoco.xml"); do
              echo "Processing $xml..." >&2
              xmlstarlet sel -t \
                -m "/report/counter[@type='INSTRUCTION']" \
                -v "concat('| ', ../@name, ' | ', \
                    format-number(@covered div (@covered + @missed) * 100, '#.#'), \
                    '% | ', \
                    format-number(../counter[@type='BRANCH']/@covered div (../counter[@type='BRANCH']/@covered + ../counter[@type='BRANCH']/@missed) * 100, '#.#'), \
                    '% |')" \
                -n "$xml" || echo "Failed to process $xml" >&2
            done
          } > coverage.md
          cat coverage.md >&2
      - name: Comment PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: coverage.md
          edit-mode: replace
  macos-arm64:
    runs-on: macos-14
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build macOS DMG
      run: mvn -B -DskipTests -DskipITs -ntp -P macos install
    - name: Standardize DMG filename
      run: |
        mkdir -p standardized
        cp desktop/target/*.dmg standardized/Manorrock-Assistant-arm64.dmg
    - name: Update SNAPSHOT release
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant-arm64.dmg
        draft: false
        update_existing: true
