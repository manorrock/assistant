name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
    - name: Set up JDK 21
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B verify
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports'
        if-no-files-found: ignore
        retention-days: 5
        compression-level: 9
        overwrite: true
    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: |
          cli/target/cli.jar
          desktop/target/desktop.jar
          netbeans/target/*.nbm
          vscode/target/*.vsix
          intellij/target/*.jar
          eclipse/target/*.jar
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
        overwrite: true
        include-hidden-files: false
  coverage:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Generate Coverage Report
        run: mvn test jacoco:report
      - name: Create Coverage Report Comment
        run: |
          echo "### Coverage Report" > coverage.md
          echo "\`\`\`" >> coverage.md
          find . -name "jacoco.csv" -exec cat {} \; | awk -F, 'NR>1 {print $1,$2,$3}' >> coverage.md
          echo "\`\`\`" >> coverage.md
      - name: Comment PR
        uses: machine-learning-apps/pr-comment@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: coverage.md
