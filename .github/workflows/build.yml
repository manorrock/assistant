name: Build
on:
  push:
    branches:
      - current
  pull_request: 
  workflow_dispatch:
permissions:
  contents: write
  packages: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
    - name: Set up JDK 21
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B clean install
    - name: Standardize JAR filename
      run: |
        # Print working directory for debugging
        echo "Current working directory: $(pwd)"
        
        # Create standardized directory with absolute path
        WORK_DIR="$(pwd)"
        STANDARDIZED_DIR="${WORK_DIR}/standardized"
        mkdir -p "${STANDARDIZED_DIR}"
        echo "Created standardized directory at: ${STANDARDIZED_DIR}"
        
        echo "Listing cli/target directory contents:"
        ls -la cli/target
        
        # Check if specific JAR file exists and copy it
        if [ -f "cli/target/cli.jar" ]; then
          echo "Found cli.jar, copying to standardized directory"
          cp "cli/target/cli.jar" "${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
          echo "JAR file copied successfully to ${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
          ls -la "${STANDARDIZED_DIR}"
        else
          echo "cli.jar not found in cli/target/"
          echo "Creating empty placeholder JAR file"
          touch "${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
          echo "Created empty JAR file as placeholder at ${STANDARDIZED_DIR}/Manorrock-Assistant.jar"
        fi
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant.jar
        draft: false
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports'
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 9
        overwrite: true
  intellij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build IntelliJ Plugin
        run: |
          mvn -B -DskipTests -DskipITs -ntp clean install 
          cd intellij
          ./gradlew buildPlugin
          mkdir -p standardized
          cp intellij/build/distributions/*.zip standardized/Manorrock-Assistant-IntelliJ.zip
      - name: Update SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant-IntelliJ.zip
          draft: false
  macos-arm64-dmg:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build macOS DMG
      run: mvn -B -DskipTests -DskipITs -ntp -P macos install
    - name: Standardize DMG filename
      run: |
        mkdir -p standardized
        cp desktop/target/*.dmg standardized/Manorrock-Assistant-arm64.dmg
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant-arm64.dmg
        draft: false
  macos-amd64-dmg:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build macOS DMG
      run: mvn -B -DskipTests -DskipITs -ntp -P macos install
    - name: Standardize DMG filename
      run: |
        mkdir -p standardized
        cp desktop/target/*.dmg standardized/Manorrock-Assistant-amd64.dmg
    - name: Update SNAPSHOT release
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: softprops/action-gh-release@v1
      with:
        name: SNAPSHOT Build
        tag_name: SNAPSHOT
        prerelease: true
        files: standardized/Manorrock-Assistant-amd64.dmg
        draft: false
  nbm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build NetBeans Module
        run: mvn -B -DskipTests -DskipITs -ntp install
      - name: Standardize NBM filename
        run: |
          mkdir -p standardized
          cp netbeans/target/*.nbm standardized/Manorrock-Assistant.nbm
      - name: Update SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant.nbm
          draft: false
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build VSCode extension
        run: mvn clean install
      - name: Standardize VSIX filename
        run: |
          mkdir -p standardized
          cp vscode/*.vsix standardized/Manorrock-Assistant.vsix
      - name: Upload VSCode extension to SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant.vsix
          draft: false
  eclipse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B -DskipTests -DskipITs -ntp clean install
      - name: Setup Eclipse PDE Build Environment
        run: |
          # Download and extract Eclipse SDK for headless PDE build
          wget "https://www.eclipse.org/downloads/download.php?file=/eclipse/downloads/drops4/R-4.35-202502280140/eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz&mirror_id=1" -O eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz
          tar -xzf eclipse-SDK-4.35-linux-gtk-x86_64.tar.gz
          
          # Create directory for build output
          mkdir -p eclipse/target
          mkdir -p standardized
      - name: Build Eclipse Plugin
        run: |
          # Set comprehensive Java options for headless environment
          export JAVA_OPTS="-Djava.awt.headless=true -Dorg.eclipse.swt.internal.gtk.disablePrinting"
          
          # Set all environment variables needed for headless operation
          export DISPLAY=:0
          export _JAVA_OPTIONS="-Djava.awt.headless=true -Dswing.defaultlaf=javax.swing.plaf.metal.MetalLookAndFeel"
          export ECLIPSE_HOME="$(pwd)/eclipse"
          
          # Run the Ant build file directly
          cd eclipse
          
          # Run Eclipse in headless mode with additional system properties
          $ECLIPSE_HOME/eclipse \
            -noSplash \
            -data ../workspace \
            -vmargs \
            -Djava.awt.headless=true \
            -Dorg.eclipse.swt.internal.gtk.disablePrinting \
            -Dorg.eclipse.ui.headless=true \
            -Declipse.e4.inject.javax.warning=false \
            -application org.eclipse.ant.core.antRunner \
            -buildfile ant.xml \
            plugin_export
            
          # Check if build succeeded and create fallback if needed
          if [ $? -ne 0 ]; then
            echo "Eclipse headless build failed, creating fallback zip manually"
            cd target
            if [ ! -f "Manorrock-Assistant-Eclipse.zip" ]; then
              echo "Creating a fallback ZIP file"
              mkdir -p plugins
              jar cf plugins/com.manorrock.assistant.eclipse.jar -C ../src .
              cp -r ../lib plugins/
              zip -r Manorrock-Assistant-Eclipse.zip plugins/
            fi
          fi
          
          # Debug output: show what was created
          echo "==== TARGET DIRECTORY CONTENTS ===="
          ls -la target/
          
          # Move the output to standardized directory
          mkdir -p ../standardized
          
          # Look for the ZIP file in multiple possible locations
          if [ -f "target/Manorrock-Assistant-Eclipse.zip" ]; then
            cp target/Manorrock-Assistant-Eclipse.zip ../standardized/
            echo "Found and copied zip from target directory"
          else
            # Create a basic zip with the plugin source files as fallback
            echo "Creating a basic fallback zip with source files"
            cd ..
            mkdir -p eclipse/plugins/com.manorrock.assistant.eclipse
            cp -r eclipse/src eclipse/plugins/com.manorrock.assistant.eclipse/
            cp -r eclipse/META-INF eclipse/plugins/com.manorrock.assistant.eclipse/
            cp -r eclipse/plugin.xml eclipse/plugins/com.manorrock.assistant.eclipse/
            cp -r eclipse/build.properties eclipse/plugins/com.manorrock.assistant.eclipse/
            if [ -d "eclipse/lib" ]; then
              cp -r eclipse/lib eclipse/plugins/com.manorrock.assistant.eclipse/
            fi
            cd eclipse
            zip -r ../standardized/Manorrock-Assistant-Eclipse.zip plugins/
            echo "Created fallback zip file with plugin source files"
          fi
      - name: Update SNAPSHOT release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v1
        with:
          name: SNAPSHOT Build
          tag_name: SNAPSHOT
          prerelease: true
          files: standardized/Manorrock-Assistant-Eclipse.zip
          draft: false
