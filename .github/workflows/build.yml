name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
    - name: Set up JDK 21
      uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0  # v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B verify
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@0b7f8abb1508181956e8e162db98b9b5f5df2519  # v3
      with:
        name: test-results
        path: '**/target/surefire-reports'
        if-no-files-found: ignore
    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@0b7f8abb1508181956e8e162db98b9b5f5df2519  # v3
      with:
        name: distribution
        path: |
          cli/target/cli.jar
          desktop/target/desktop.jar
          netbeans/target/*.nbm
          vscode/target/*.vsix
          intellij/target/*.jar
          eclipse/target/*.jar
        if-no-files-found: error
