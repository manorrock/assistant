name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn -B verify
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: '**/target/surefire-reports'
        if-no-files-found: ignore
    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: distribution
        path: |
          cli/target/cli.jar
          desktop/target/desktop.jar
          netbeans/target/*.nbm
          vscode/target/*.vsix
          intellij/target/*.jar
          eclipse/target/*.jar
        if-no-files-found: error
