name: Version Management

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment type (patch, minor, major, or specific version)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - specific
      specific_version:
        description: 'Specific version to set (only used if increment is "specific")'
        required: false
        type: string

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.set-version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(mvn -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          # Strip -SNAPSHOT suffix if present
          CLEAN_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Set new version
        id: set-version
        run: |
          CLEAN_VERSION=${{ steps.current-version.outputs.clean_version }}
          INCREMENT_TYPE=${{ github.event.inputs.increment }}
          
          # Split version into components
          MAJOR=$(echo $CLEAN_VERSION | cut -d. -f1)
          MINOR=$(echo $CLEAN_VERSION | cut -d. -f2)
          PATCH=$(echo $CLEAN_VERSION | cut -d. -f3)
          
          # Calculate new version
          if [ "$INCREMENT_TYPE" = "patch" ]; then
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          elif [ "$INCREMENT_TYPE" = "minor" ]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          elif [ "$INCREMENT_TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$INCREMENT_TYPE" = "specific" ]; then
            NEW_VERSION="${{ github.event.inputs.specific_version }}"
            if [ -z "$NEW_VERSION" ]; then
              echo "Error: Specific version must be provided when increment type is 'specific'"
              exit 1
            fi
          else
            echo "Error: Invalid increment type: $INCREMENT_TYPE"
            exit 1
          fi
          
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  trigger-release:
    needs: calculate-version
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Release Workflow
          inputs: |
            {
              "version": "${{ needs.calculate-version.outputs.new_version }}",
              "branch": "current"
            }
          token: ${{ secrets.GITHUB_TOKEN }}
