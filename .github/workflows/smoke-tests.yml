name: Deployment Smoke Tests

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build artifacts
        run: mvn -B -DskipTests -DskipITs package
        
      - name: CLI Smoke Tests
        run: |
          # Version check
          VERSION=$(java -jar "${PWD}/cli/target/cli.jar" --version)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          
          # Help command check
          HELP=$(java -jar cli/target/cli.jar /help)
          if [[ ! $HELP =~ "Available commands:" ]]; then
            echo "Help text missing expected content"
            exit 1
          fi
          
          # Model command check - set model to gpt4
          if ! java -jar "${PWD}/cli/target/cli.jar" "/llmModel gpt4"; then
            echo "Failed to set model to gpt4"
            exit 1
          fi
          
      - name: Verify IDE Plugin Artifacts and Structure
        run: |
          # VSCode extension validation
          test -f vscode/target/*.vsix
          unzip -l vscode/target/*.vsix | grep -q "extension.js"
          
          # IntelliJ plugin validation
          test -f intellij/build/distributions/*.zip
          unzip -l intellij/build/distributions/*.zip | grep -q "META-INF/plugin.xml"
          
          # NetBeans plugin validation
          test -f netbeans/target/*.nbm
          unzip -l netbeans/target/*.nbm | grep -q "META-INF/MANIFEST.MF"
          
      - name: Desktop App Functional Test
        run: |
          # Start app and verify it responds to basic commands
          TEMP_FILE=$(mktemp)
          timeout 30s java -jar desktop/target/assistant-desktop.jar > $TEMP_FILE 2>&1 &
          PID=$!
          
          # Wait for app to start
          sleep 10
          
          # Check if process is responding
          if ! kill -0 $PID 2>/dev/null; then
            echo "Desktop app failed to start"
            cat $TEMP_FILE
            exit 1
          fi
          
          # Check log output for successful startup
          if ! grep -q "Application started successfully" $TEMP_FILE; then
            echo "Desktop app startup verification failed"
            cat $TEMP_FILE
            exit 1
          fi
          
          # Clean up
          kill $PID
          rm $TEMP_FILE
